# ============================================================================
# Label Printer Hub — Traefik
# One container: the backend serves the API and the web UI (ADR 0015), so
# Traefik routes straight to backend:8000. Printers are added in the UI.
# Assumes a Traefik instance with HTTPS and a "letsencrypt" certresolver
# is already running, attached to a docker network called "traefik".
# ============================================================================

services:
  backend:
    image: ghcr.io/strausmann/label-printer-hub-backend:${HUB_VERSION:-latest}
    container_name: label-printer-hub-backend
    user: "1000:1000"
    networks:
      - traefik
    expose:
      - "${BACKEND_PORT:-8000}"
    environment:
      - PORT=${BACKEND_PORT:-8000}
      # Trust X-Forwarded-For from exactly one peer: the proxy's fixed address (#160). Behind the proxy every
      # client otherwise looks like the proxy and shares one sign-in rate-limit bucket. Never "*" or a
      # subnet: any other container on the network could then forge the client address.
      # Pin the proxy's address in the proxy's own stack (ipv4_address on this network) and set PROXY_IP.
      # uvicorn takes the right-most X-Forwarded-For entry that is not trusted. Traefik appends the peer address to X-Forwarded-For by default (notAppendXForwardedFor=false)
      # and drops it from untrusted sources (forwardedHeaders.trustedIPs unset), so the right-most entry is the real client.
      - "FORWARDED_ALLOW_IPS=${PROXY_IP:?set PROXY_IP to the fixed address of your reverse proxy on this network - e.g. 192.0.2.10}"
      - "PRINTER_HUB_SECRET_KEY=${PRINTER_HUB_SECRET_KEY:?set PRINTER_HUB_SECRET_KEY - generate with: openssl rand -base64 32 | tr '+/' '-_'}"
      - "PRINTER_HUB_PUBLIC_URL=${PRINTER_HUB_PUBLIC_URL:?set PRINTER_HUB_PUBLIC_URL, e.g. https://printerhub.example.invalid}"
      - PRINTER_HUB_DATABASE_URL=${PRINTER_HUB_DATABASE_URL:-sqlite+aiosqlite:////data/printer-hub.db}
      - PRINTER_HUB_WEBHOOK_API_KEY=${PRINTER_HUB_WEBHOOK_API_KEY:-}
      - PRINTER_HUB_LOG_LEVEL=${PRINTER_HUB_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BACKEND_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # Main UI (you may add a forward-auth middleware like Authelia here)
      - "traefik.http.routers.printerhub.rule=Host(`${PRINTERHUB_HOST}`)"
      - "traefik.http.routers.printerhub.entrypoints=websecure"
      - "traefik.http.routers.printerhub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.printerhub.service=printerhub"
      # Optional: enable an existing forward-auth middleware
      # - "traefik.http.routers.printerhub.middlewares=authelia@docker"

      # Webhook subroute (no SSO/auth — uses PRINTER_HUB_WEBHOOK_API_KEY)
      - "traefik.http.routers.printerhub-webhooks.rule=Host(`${PRINTERHUB_HOST}`) && PathPrefix(`/api/webhook/`)"
      - "traefik.http.routers.printerhub-webhooks.entrypoints=websecure"
      - "traefik.http.routers.printerhub-webhooks.tls.certresolver=letsencrypt"
      - "traefik.http.routers.printerhub-webhooks.priority=20"
      - "traefik.http.routers.printerhub-webhooks.service=printerhub"

      - "traefik.http.services.printerhub.loadbalancer.server.port=${BACKEND_PORT:-8000}"
      # SSE: disable buffering for the live event stream (/api/v1/events)
      - "traefik.http.services.printerhub.loadbalancer.responseforwarding.flushinterval=100ms"

networks:
  traefik:
    external: true
