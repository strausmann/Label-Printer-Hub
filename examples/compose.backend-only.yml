# ============================================================================
# Label Printer Hub — API only (no web UI, no reverse proxy)
#
# For driving the REST API directly via curl/Postman/etc. Builds the image
# from source on the host that runs `docker compose` (no GHCR pull) with
# WEB_SOURCE=web-stub, i.e. WITHOUT the web UI. For the full hub (API and UI
# in the same single container) use compose.standalone.yml.
#
# Usage on any docker host:
#
#   git clone https://github.com/strausmann/Label-Printer-Hub.git
#   cd Label-Printer-Hub
#   cp examples/.env.example .env
#   $EDITOR .env             # set PRINTER_HUB_SECRET_KEY and PRINTER_HUB_PUBLIC_URL
#   docker compose -f examples/compose.backend-only.yml up -d --build
#
# Then:
#   curl http://localhost:8090/healthz
#   curl http://localhost:8090/api/info
#
# Add printers through the API (POST /api/v1/admin/printers with an admin key); create
# the first key with:
#   docker exec label-printer-hub-backend printer-hub admin create-key --scope admin --name first-admin
# ============================================================================

services:
  backend:
    build:
      # The repository root: the Dockerfile also builds the web app from frontend/.
      context: ..
      dockerfile: backend/Dockerfile
      args:
        WEB_SOURCE: web-stub
    image: label-printer-hub-backend:dev
    container_name: label-printer-hub-backend
    user: "1000:1000"
    ports:
      # host:container — host port is what curl talks to.
      - "${HUB_PORT:-8090}:8000"
    env_file:
      - ../.env
    environment:
      # Container-internal port. Must match the `EXPOSE` in the Dockerfile.
      PORT: "8000"
      # FORWARDED_ALLOW_IPS is left at the image default (127.0.0.1): never "*", which would let
      # any client forge X-Forwarded-For. See #160 for the trusted-proxy design.
      # Required since the settings rework; a missing value is a compose-time error.
      PRINTER_HUB_SECRET_KEY: "${PRINTER_HUB_SECRET_KEY:?set PRINTER_HUB_SECRET_KEY - generate with: openssl rand -base64 32 | tr '+/' '-_'}"
      PRINTER_HUB_PUBLIC_URL: "${PRINTER_HUB_PUBLIC_URL:?set PRINTER_HUB_PUBLIC_URL, e.g. http://localhost:8090}"
    volumes:
      # SQLite + future job-state persistence. Owned by UID 1000 on host.
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # SNMP needs UDP/161 outbound to reach the printer; the print protocol needs TCP/9100.
    # Default bridge networking handles both — no extra config needed as
    # long as the printer is reachable from the docker host's network namespace.
