# ============================================================================
# Label Printer Hub — Caddy
# One container: the backend serves the API and the web UI (ADR 0015); Caddy
# proxies to backend:8000 and obtains TLS certificates automatically.
# Assumes a Caddy 2 instance with caddy-docker-proxy is running on a docker
# network called "caddy". Printers are added in the UI.
# ============================================================================

services:
  backend:
    image: ghcr.io/strausmann/label-printer-hub-backend:${HUB_VERSION:-latest}
    container_name: label-printer-hub-backend
    user: "1000:1000"
    networks:
      - caddy
    expose:
      - "${BACKEND_PORT:-8000}"
    environment:
      - PORT=${BACKEND_PORT:-8000}
      # Reachable only through the proxy network, so its forwarded headers are accepted.
      # Never "*": trusting every peer lets any client forge X-Forwarded-For. Set the proxy address or
      # network here once the trusted-proxy design (#160) lands; the default is loopback only.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - "PRINTER_HUB_SECRET_KEY=${PRINTER_HUB_SECRET_KEY:?set PRINTER_HUB_SECRET_KEY - generate with: openssl rand -base64 32 | tr '+/' '-_'}"
      - "PRINTER_HUB_PUBLIC_URL=${PRINTER_HUB_PUBLIC_URL:?set PRINTER_HUB_PUBLIC_URL, e.g. https://printerhub.example.invalid}"
      - PRINTER_HUB_DATABASE_URL=${PRINTER_HUB_DATABASE_URL:-sqlite+aiosqlite:////data/printer-hub.db}
      - PRINTER_HUB_WEBHOOK_API_KEY=${PRINTER_HUB_WEBHOOK_API_KEY:-}
      - PRINTER_HUB_LOG_LEVEL=${PRINTER_HUB_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BACKEND_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      caddy: ${PRINTERHUB_HOST}
      caddy.reverse_proxy: "{{upstreams ${BACKEND_PORT:-8000}}}"
      # SSE: disable response buffering for the live event stream (/api/v1/events)
      caddy.reverse_proxy.flush_interval: "-1"

networks:
  caddy:
    external: true
