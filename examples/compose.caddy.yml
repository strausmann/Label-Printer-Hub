# ============================================================================
# Labelyard — Caddy
# One container: the backend serves the API and the web UI (ADR 0015); Caddy
# proxies to labelyard:8000 and obtains TLS certificates automatically.
# Assumes a Caddy 2 instance with caddy-docker-proxy is running on a docker
# network called "caddy". Printers are added in the UI.
# ============================================================================

services:
  labelyard:
    image: ghcr.io/strausmann/labelyard:${HUB_VERSION:-1.6.0}
    container_name: labelyard
    user: "1000:1000"
    networks:
      - caddy
    expose:
      - "${BACKEND_PORT:-8000}"
    environment:
      - PORT=${BACKEND_PORT:-8000}
      # Trust X-Forwarded-For from exactly one peer: the proxy's fixed address (#160). Behind the proxy every
      # client otherwise looks like the proxy and shares one sign-in rate-limit bucket. Never "*" or a
      # subnet: any other container on the network could then forge the client address.
      # Pin the proxy's address in the proxy's own stack (ipv4_address on this network) and set PROXY_IP.
      # uvicorn takes the right-most X-Forwarded-For entry that is not trusted. Caddy replaces any client-supplied X-Forwarded-For with the real peer address by default
      # (reverse_proxy trusted_proxies unset), so the right-most entry is always the real client.
      - "FORWARDED_ALLOW_IPS=${PROXY_IP:?set PROXY_IP to the fixed address of your reverse proxy on this network - e.g. 192.0.2.10}"
      - "LABELYARD_SECRET_KEY=${LABELYARD_SECRET_KEY:?set LABELYARD_SECRET_KEY - generate with: openssl rand -base64 32 | tr '+/' '-_'}"
      - "LABELYARD_PUBLIC_URL=${LABELYARD_PUBLIC_URL:?set LABELYARD_PUBLIC_URL, e.g. https://labelyard.example.invalid}"
      - LABELYARD_DATABASE_URL=${LABELYARD_DATABASE_URL:-sqlite+aiosqlite:////data/printer-hub.db}
      - LABELYARD_WEBHOOK_API_KEY=${LABELYARD_WEBHOOK_API_KEY:-}
      - LABELYARD_LOG_LEVEL=${LABELYARD_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BACKEND_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      caddy: ${LABELYARD_HOST}
      caddy.reverse_proxy: "{{upstreams ${BACKEND_PORT:-8000}}}"
      # SSE: disable response buffering for the live event stream (/api/v1/events)
      caddy.reverse_proxy.flush_interval: "-1"

networks:
  caddy:
    external: true
