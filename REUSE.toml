# SPDX-FileCopyrightText: 2026 Björn Strausmann and Labelyard contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Licensing of the files that cannot or must not carry an inline SPDX header.
# Every own file whose format allows a comment carries the header inline instead;
# backend/tests/unit/test_spdx_headers.py enforces that and reads the paths below, so
# each [[annotations]] block needs a comment saying why the file is listed here.
# Own files come first; third-party files follow with precedence = "override" so a
# later, wider own glob can never relicense them.

version = 1

# Data format: JSON of every kind (no comment syntax), including
# licence-policy.yml, which both licence gates parse as JSON.
[[annotations]]
path = ["**/*.json", "licence-policy.yml", "frontend/public/manifest.webmanifest"]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Data format: lockfiles written by pnpm, and .nvmrc, which holds only a version number.
[[annotations]]
path = ["frontend/pnpm-lock.yaml", "website/pnpm-lock.yaml", "frontend/.nvmrc", "website/.nvmrc"]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by semantic-release (CHANGELOG.md), by `pnpm gen:api`
# (frontend/src/api/schema.gen.ts) and by Lingui (*.po): a header would be dropped
# on the next run.
[[annotations]]
path = ["CHANGELOG.md", "frontend/src/api/schema.gen.ts", "frontend/src/i18n/locales/*/messages.po"]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by scripts/glossary.py write (prose.yml checks it with git diff --exit-code).
[[annotations]]
path = [
  ".vale/styles/Labelyard/Terms.yml",
  ".vale/styles/Labelyard-de/Terms.yml",
  ".vale/styles/Labelyard-de/Label.yml",
  ".vale/styles/config/vocabularies/*/accept.txt",
  ".vale/styles/config/vocabularies/*/reject.txt",
]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Front matter: Starlight pages must start with YAML front matter in line 1, and .mdx
# accepts no HTML comment. The glossary and configuration pages in here are also
# generated (scripts/glossary.py, website/scripts/gen-config-reference.py). The Vale
# fixture imitates such a page.
[[annotations]]
path = ["website/src/content/docs/**", "scripts/fixtures/vale/rejected-term.md"]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by backend/scripts/generate_template_svgs.py (SVG samples) and by
# backend/tests/unit/printer_backends/ipp/fixtures/assemble.py (*.bin wire fixtures).
[[annotations]]
path = [
  "docs/site/operations/templates/svg-samples/*.svg",
  "backend/tests/unit/printer_backends/ipp/fixtures/*.bin",
]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Byte copy of docs/brand/labelyard/ (the logo sources and icons): the copies in
# frontend/public/ and website/ must stay byte-identical to their source (copy tests),
# so source and copies are all annotated here, SVGs included.
[[annotations]]
path = [
  "docs/brand/labelyard/*.svg",
  "docs/brand/labelyard/*.png",
  "docs/brand/labelyard/*.ico",
  "frontend/public/*.svg",
  "frontend/public/*.png",
  "frontend/public/*.ico",
  "frontend/public/brand/*.svg",
  "frontend/public/brand/*.png",
  "website/public/*.svg",
  "website/public/*.png",
  "website/public/*.ico",
  "website/src/assets/*.svg",
]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Data format: binary images (screenshots of the web app, layout test fixtures).
[[annotations]]
path = [
  "docs/screenshots/*.png",
  "website/src/assets/screens/*.webp",
  "backend/tests/fixtures/ql_layout/*.png",
]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Data format: plain text without comment syntax (the Alembic README) and the
# ASCII-armoured public key of the security contact.
[[annotations]]
path = ["backend/alembic/README", ".well-known/security.asc"]
SPDX-FileCopyrightText = "2026 Björn Strausmann and Labelyard contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Third-party: the AGPL text itself (LICENSE at the root stays for the A5 tests).
[[annotations]]
path = "LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Third-party: Contributor Covenant 2.1, created by Coraline Ada Ehmke in 2014 and stewarded
# by the Organization for Ethical Source; CC BY 4.0 (the licence of the text at version 2.1),
# adapted with the project's contact address.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "2014 Coraline Ada Ehmke and Contributor Covenant contributors <https://www.contributor-covenant.org>",
  "2026 Björn Strausmann and Labelyard contributors",
]
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party: Atkinson Hyperlegible Next (google/fonts@66eef70) and its licence text.
[[annotations]]
path = [
  "backend/app/page_render/fonts/AtkinsonHyperlegibleNext-Variable.ttf",
  "backend/app/page_render/fonts/LICENSE-AtkinsonHyperlegibleNext-OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next)"
SPDX-License-Identifier = "OFL-1.1"

# Third-party: IBM Plex Mono Bold (google/fonts@633f320) and its licence text.
[[annotations]]
path = [
  "backend/app/page_render/fonts/IBMPlexMono-Bold.ttf",
  "backend/app/page_render/fonts/LICENSE-IBMPlexMono-OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# Third-party: DejaVu Sans 2.37 (Debian fonts-dejavu-core) and its licence text. The
# fonts are (c) Bitstream; the glyphs imported from the Arev fonts are (c) Tavmjong Bah
# under the Arev licence (the Bitstream Vera text with the names changed); the DejaVu
# changes are in the public domain.
[[annotations]]
path = [
  "backend/app/page_render/fonts/DejaVuSans.ttf",
  "backend/app/page_render/fonts/LICENSE-DejaVu.txt",
]
precedence = "override"
SPDX-FileCopyrightText = ["2003 Bitstream, Inc.", "2006 Tavmjong Bah"]
SPDX-License-Identifier = "Bitstream-Vera"

# Third-party: licence texts shipped in the image (B1), each under its own licence.
[[annotations]]
path = "backend/licences/GPL-3.0-or-later.txt"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Third-party: the MIT licence text of gLabels-qt (B1).
[[annotations]]
path = "backend/licences/glabels-qt-MIT.txt"
precedence = "override"
SPDX-FileCopyrightText = "2001-2026 Jaye Evins"
SPDX-License-Identifier = "MIT"

# Third-party: the MIT licence text of the packbits package (B1).
[[annotations]]
path = "backend/licences/packages/packbits.txt"
precedence = "override"
SPDX-FileCopyrightText = "Mikhail Korobov"
SPDX-License-Identifier = "MIT"

# Third-party: the MIT licence text of @scalar/api-reference.
[[annotations]]
path = "frontend/licenses/scalar-api-reference-MIT.txt"
precedence = "override"
SPDX-FileCopyrightText = "2023-present Scalar"
SPDX-License-Identifier = "MIT"

# Third-party: the Apache-2.0 licence text of zxing-cpp (in zxing-wasm).
[[annotations]]
path = "frontend/licenses/zxing-cpp-Apache-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2016 Nu-book Inc.", "2016 ZXing authors"]
SPDX-License-Identifier = "Apache-2.0"

# Third-party data: the sheet geometries derived from the gLabels-qt templates
# (commit 37901c1, MIT); THIRD_PARTY_NOTICES.md quotes the licence.
[[annotations]]
path = "backend/app/seed/sheet_types.json"
precedence = "override"
SPDX-FileCopyrightText = [
  "2001-2026 Jaye Evins",
  "2026 Björn Strausmann and Labelyard contributors",
]
SPDX-License-Identifier = "MIT"
