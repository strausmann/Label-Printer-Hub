name: Licences — weekly snapshot check

# Python has no lockfile, so the backend packages that land in the image depend on what PyPI
# serves on the day. This workflow builds the image without any cache every Monday, so the
# newest resolvable versions are picked up, and compares the licences it carries with
# licences/snapshot.json. A difference fails THIS run and is written to the run summary; it never
# touches a pull request. To accept it: python3 scripts/licence_snapshot.py update.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Image licences against the snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: labelyard:licence-weekly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build without cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}

      - name: Compare the image licences with the snapshot
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image-licences"
          mkdir -p "$out"
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/opt/app/web/licenses/backend.json" "$out/backend.json"
          docker cp "$cid:/opt/app/web/licenses/frontend.json" "$out/frontend.json"
          docker rm "$cid" > /dev/null
          python3 scripts/licence_snapshot.py check --backend "$out/backend.json" --frontend "$out/frontend.json"
