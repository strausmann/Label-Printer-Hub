# Build a preview image of a milestone before its release, e.g. 1.5.0-rc.3.
#
# Run it by hand on the branch that holds the milestone's work (or on main).
# Version is x.y.z or, for a patch milestone, x.y.x (next free patch).
# The rc number counts up from the tags already in GHCR. A preview gets only
# its exact tag: no `latest`, no x.y / x, no Docker Hub (docker-publish.yml
# treats every version with a `-` as a pre-release). ghcr-cleanup.yml keeps
# previews while their release does not exist and removes them afterwards.

name: Preview image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version the preview leads to: 1.6.0, or 1.5.x for the next free patch"
        type: string
        required: true

permissions: {}

concurrency:
  # Shared with ghcr-cleanup.yml (see there).
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  next-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Compute the next rc tag
        id: next
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PATH: ${{ github.repository_owner }}/label-printer-hub-backend
        run: |
          set -euo pipefail
          # 1.5.x -> 1.5.<next free patch>-rc.N; 1.6.0 -> 1.6.0-rc.N; a released
          # version is refused. A package that does not exist yet (first preview
          # of a new image) has an empty tag list: 403/404 is tolerated there.
          python3 scripts/ghcr_rules.py fetch-tags > tags.txt
          tag=$(python3 scripts/ghcr_rules.py next-preview "$VERSION" < tags.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: next-tag
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.next-tag.outputs.tag }}
      ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
