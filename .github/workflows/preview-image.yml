# Build a preview image of a milestone before its release, e.g. 1.5.0-rc.3.
#
# Run it by hand on the branch that holds the milestone's work (or on main).
# Version is x.y.z or, for a patch milestone, x.y.x (next free patch).
# The rc number counts up from the tags already in GHCR
# (ghcr.io/strausmann/labelyard); the same tag goes to GHCR and Docker Hub
# (docker.io/<DOCKERHUB_USERNAME>/labelyard). A preview gets only its exact
# tag: no `latest`, no x.y / x (docker-publish.yml treats every version with a
# `-` as a pre-release). registry-cleanup.yml keeps previews on both registries
# while their release does not exist and removes them afterwards.

name: Preview image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version the preview leads to: 1.6.0, or 1.5.x for the next free patch"
        type: string
        required: true

permissions: {}

concurrency:
  # Shared with registry-cleanup.yml (see there).
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  next-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Compute the next rc tag
        id: next
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PATH: strausmann/labelyard
        run: |
          set -euo pipefail
          # 1.5.x -> 1.5.<next free patch>-rc.N; 1.6.0 -> 1.6.0-rc.N; a released
          # version is refused. A package that does not exist yet (first preview
          # of a new image) has an empty tag list: 403/404 is tolerated there.
          python3 scripts/ghcr_rules.py fetch-tags > tags.txt
          tag=$(python3 scripts/ghcr_rules.py next-preview "$VERSION" < tags.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: next-tag
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.next-tag.outputs.tag }}
      ref: ${{ github.sha }}
    # By name, as release.yml does: no `inherit`, and never the admin token.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write
