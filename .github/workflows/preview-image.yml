# Build a preview image of a milestone before its release, e.g. 1.5.0-rc.3.
#
# Run it by hand on the branch that holds the milestone's work (or on main).
# The rc number counts up from the tags already in GHCR. A preview gets only
# its exact tag: no `latest`, no x.y / x, no Docker Hub (docker-publish.yml
# treats every version with a `-` as a pre-release). ghcr-cleanup.yml keeps
# previews while their release does not exist and removes them afterwards.

name: Preview image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version the preview leads to, e.g. 1.5.0"
        type: string
        required: true

permissions: {}

concurrency:
  group: preview-image
  cancel-in-progress: false

jobs:
  next-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Compute the next rc tag
        id: next
        env:
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PATH: ${{ github.repository_owner }}/label-printer-hub-backend
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be x.y.z, got '$VERSION'"; exit 1
          fi
          image="${IMAGE_PATH,,}"
          # Credentials go through curl's stdin config, never argv.
          registry_token=$(printf 'user = "%s:%s"\n' "$ACTOR" "$GHCR_TOKEN" \
            | curl -fsS -K - "https://ghcr.io/token?scope=repository:${image}:pull" | jq -r .token)
          tags=$(printf 'header = "Authorization: Bearer %s"\n' "$registry_token" \
            | curl -fsS -K - "https://ghcr.io/v2/${image}/tags/list?n=10000" | jq -r '.tags[]?')
          if grep -qxF "$VERSION" <<<"$tags"; then
            echo "::error::$VERSION is already released; a preview must lead to an unreleased version"; exit 1
          fi
          escaped="${VERSION//./\\.}"
          last=$(grep -E "^${escaped}-rc\.[0-9]+$" <<<"$tags" | sed -E 's/.*-rc\.//' | sort -n | tail -n1 || true)
          tag="${VERSION}-rc.$(( ${last:-0} + 1 ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: next-tag
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.next-tag.outputs.tag }}
      ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
