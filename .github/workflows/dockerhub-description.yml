# Push .github/dockerhub/README.md and the short description to the Docker Hub
# repository docker.io/<DOCKERHUB_USERNAME>/labelyard.
#
# Runs when the README changes on main, or by hand. The action needs a personal
# access token with Read, Write, Delete (DOCKERHUB_ADMIN_TOKEN); the push token
# DOCKERHUB_TOKEN cannot edit repository metadata. Limits (from the action):
# README 25,000 bytes, short description 100 bytes.

name: Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - .github/dockerhub/README.md
  workflow_dispatch:

permissions: {}

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  description:
    name: Update the Docker Hub description
    # Forks have no Docker Hub secrets; skip instead of failing there.
    if: github.repository_owner == 'strausmann'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/dockerhub
          persist-credentials: false

      - name: Update the description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ADMIN_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/labelyard
          short-description: "Labelyard — the self-hosted Label Printer Hub for all your labels"
          readme-filepath: .github/dockerhub/README.md
          enable-url-completion: false
