name: Screenshots

# Renders the README screenshots (docs/screenshots/) from the e2e fixtures and opens a pull request
# when any of them changed. Manual only: `pnpm screenshots` is the same command, run locally.
on:
  workflow_dispatch:

# It writes to the repository (a branch and a pull request), so every action is pinned by commit SHA.
permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Render the README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token must not stay in .git/config; only the pull request step below receives it.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Render the screenshots
        env:
          E2E_PYTHON: python
        run: pnpm screenshots

      - name: Open a pull request when a screenshot changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/screenshots/*.png
          branch: docs/readme-screenshots
          delete-branch: true
          commit-message: "docs(ui): refresh the generated README screenshots"
          title: "docs(ui): refresh the generated README screenshots"
          # Opened with GITHUB_TOKEN, this pull request starts no CI run (see CONTRIBUTING, Web UI screenshots).
          body: |
            The README screenshots were rendered again by the Screenshots workflow (`pnpm screenshots`)
            from the e2e fixtures and differ from the committed ones.

            Refs #260
