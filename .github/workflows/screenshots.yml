name: Screenshots

# Renders the README screenshots (docs/screenshots/) and the website screenshots
# (website/src/assets/screens/, English and German) from the e2e fixtures and opens a pull request
# when any of them changed. Manual only: `pnpm screenshots` is the same command, run locally.
on:
  workflow_dispatch:

# It writes to the repository (a branch and a pull request), so every action is pinned by commit SHA.
permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Render the README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The write token must not stay in .git/config; only the pull request step below receives it.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Render the screenshots
        env:
          E2E_PYTHON: python
        run: pnpm screenshots

      - name: Open a pull request when a screenshot changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/screenshots/*.png
            website/src/assets/screens/*.webp
          branch: docs/readme-screenshots
          delete-branch: true
          commit-message: "docs(ui): refresh the generated README screenshots"
          title: "docs(ui): refresh the generated README screenshots"
          # Opened with GITHUB_TOKEN, this pull request starts no CI run (see CONTRIBUTING, Web UI screenshots).
          body: |
            The README screenshots were rendered again by the Screenshots workflow (`pnpm screenshots`)
            from the e2e fixtures and differ from the committed ones.

            Refs #260
