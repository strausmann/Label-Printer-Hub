name: Screenshots

# Renders the README screenshots (docs/screenshots/) from the e2e fixtures and opens a pull request
# when any of them changed. Manual only: `pnpm screenshots` is the same command, run locally.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Render the README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Render the screenshots
        env:
          E2E_PYTHON: python
        run: pnpm screenshots

      - name: Open a pull request when a screenshot changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: docs/screenshots/*.png
          branch: docs/readme-screenshots
          delete-branch: true
          commit-message: "docs(ui): refresh the generated README screenshots"
          title: "docs(ui): refresh the generated README screenshots"
          body: |
            The README screenshots were rendered again by the Screenshots workflow (`pnpm screenshots`)
            from the e2e fixtures and differ from the committed ones.

            Refs #260
