name: CI

on:
  # milestone/** too: feature PRs target the milestone integration branch
  # (CONTRIBUTING.md, "Milestones, branches and releases").
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main, 'milestone/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, type, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Detect Python project
        id: pyproject
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=backend" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python (with cache)
        if: steps.pyproject.outputs.exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.pyproject.outputs.path }}/pyproject.toml

      - name: Set up Python (without cache, no pyproject.toml yet)
        if: steps.pyproject.outputs.exists != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        run: ruff check .

      - name: Ruff format check
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        run: ruff format --check .

      # Mypy is a HARD CI gate — strict mode is configured in pyproject.toml
      # ([tool.mypy] strict = true). We do not use `|| true` here; type-check
      # regressions must fail CI, not be merged silently. See CONTRIBUTING.md.
      - name: Mypy (strict, blocking)
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        run: mypy app/

      - name: Derive fake test secret key
        if: steps.pyproject.outputs.exists == 'true'
        # Built from readable text at runtime, so no high-entropy literal is checked in.
        run: echo "LABELYARD_SECRET_KEY=$(printf %s test-secret-key-0123456789abcdef | base64 | tr '+/' '-_')" >> "$GITHUB_ENV"

      # --cov-fail-under is a HARD CI gate. The 80% floor mirrors
      # [tool.coverage.report].fail_under in pyproject.toml — declaring it
      # again on the command line makes the failure surface in the test step
      # itself (with the exact `TOTAL` line) instead of in a separate
      # `coverage report` step that pytest-cov would silently swallow.
      #
      # -m "not slow" excludes wall-clock SSE timing tests (marked @pytest.mark.slow
      # in tests/integration/test_sse_flush.py).  These tests use real asyncio
      # sleep timers and are too slow for every-commit CI.  Run them separately
      # via: pytest -m slow tests/integration/test_sse_flush.py
      - name: Tests
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        # Required settings are read at import time; obviously fake CI-only values.
        env:
          LABELYARD_PUBLIC_URL: http://localhost:8000
        run: pytest -m "not slow" --cov=app --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml -o junit_family=legacy -v

      - name: Alembic — no pending migrations
        if: steps.pyproject.outputs.exists == 'true'
        working-directory: ${{ steps.pyproject.outputs.path }}
        run: |
          # alembic check compares SQLModel.metadata against the latest migration
          # head, but requires a DB at head first. Upgrade-then-check on a clean
          # data/ directory keeps CI deterministic.
          mkdir -p data
          alembic upgrade head
          alembic check

      - name: Upload coverage to Codecov
        if: always() && hashFiles('backend/coverage.xml', 'coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml,coverage.xml
          fail_ci_if_error: false
          flags: backend

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('backend/junit.xml', 'junit.xml') != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/junit.xml,junit.xml

      - name: No-op (no Python project yet — skipped)
        if: steps.pyproject.outputs.exists != 'true'
        run: echo "No pyproject.toml found — skipping Python checks for this branch"

  scripts:
    name: Scripts — unit tests
    # The release tooling (release_impact.py, ghcr_rules.py) is also checked by
    # release-impact.yml, but only on pull requests into main. This job runs the
    # same tests on every push and pull request into main and milestone/**, so a
    # red script test shows up on the milestone branch, not at the milestone PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The Vale counter-tests (scripts/test_vale_rules.py) fail under CI without Vale.
      - name: Install Vale
        run: scripts/vale_setup.sh

      - name: Run the script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  web:
    name: Web — typecheck, lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (coverage threshold 70)
        run: pnpm test:coverage

      - name: Unit tests of the build scripts
        run: node --test 'scripts/*.test.mjs'

      # The API types are generated from the backend's OpenAPI; a stale file fails here.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (for the OpenAPI export)
        working-directory: backend
        run: pip install -e .

      - name: API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.gen.ts

      - name: Build
        run: pnpm build

      - name: Built output checks (external font URLs, licence gate)
        env:
          REQUIRE_DIST: "1"
        run: pnpm exec vitest run src/build.test.ts src/licences/build-gate.test.ts

      # Browser tests against the real backend serving the build (backend/tests/e2e_app.py).
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          E2E_PYTHON: python
        run: pnpm e2e

      # Real-browser layout checks of components no route shows yet (44 px tap targets, no sideways page scroll).
      - name: Component layout checks
        run: pnpm e2e:harness

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker-build:
    name: Docker — build smoke test
    runs-on: ubuntu-24.04
    env:
      IMAGE: labelyard:ci
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      # The embedded CycloneDX document (frontend.cdx.json) is only read with the SBOM cataloger.
      # If it is missing from the image, or the packages below are not in it, the build fails here.
      - name: Check the embedded SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" "$IMAGE" --select-catalogers +sbom-cataloger -o json \
            | jq -e '[.artifacts[].name] as $n | ($n|index("react")) and ($n|index("react-dom")) and ($n|index("brother-ql")) and ($n|index("tini"))'

      - name: Check the licence files in the image
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -s /opt/app/web/licenses/backend.json && test -s /opt/app/web/licenses/frontend.json && test -s /opt/app/web/frontend.cdx.json && test -s /opt/app/LICENSE && test -s /opt/app/web/licenses/agpl-3.0.txt && test -s /usr/share/doc/tini/copyright && test -f /opt/venv/lib/python3.12/site-packages/brother_ql/__init__.py'

      # Informational only, never a gate: what the default catalogues find without the SBOM cataloger.
      - name: Default catalogue (informational)
        continue-on-error: true
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          found=$("$SYFT" "$IMAGE" -o json | jq '[.artifacts[].name] | index("react") != null')
          echo "Default catalogue finds react: ${found}" >> "$GITHUB_STEP_SUMMARY"

  privacy-scan:
    name: Privacy / secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for private network artefacts
        run: |
          set +e
          # IP-like patterns use PCRE negative lookbehind/lookahead so that
          # they only match real IPv4 addresses, not SNMP OIDs (1.3.6.1.…)
          # or version strings.
          ip_patterns=(
            '(?<![0-9.])172\.16\.[0-9]+\.[0-9]+(?![0-9.])'
            '(?<![0-9.])192\.168\.[0-9]+\.[0-9]+(?![0-9.])'
            '(?<![0-9.])10\.[0-9]+\.[0-9]+\.[0-9]+(?![0-9.])'
            '(?<![0-9.])100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+(?![0-9.])'
          )
          # String patterns use ERE (no boundary tricks needed)
          str_patterns=(
            'hhdocker'
            'hhplex'
            'strausmann\.cloud'
            'strausmann\.de'
            'strausmann\.net'
            'lager\.strausmann'
          )
          # Files exempted because they DOCUMENT the policy (the patterns are
          # listed there as "don't do this" examples). All other markdown is
          # scanned — README, examples, wiki-mirrored content, ADRs, etc.
          exempt=(
            ':!docs/policies/privacy.md'
            ':!.gemini/styleguide.md'
            ':!.github/copilot-instructions.md'
            ':!.github/workflows/ci.yml'
          )

          fail=0
          for p in "${ip_patterns[@]}"; do
            hits=$(git grep -nIP "$p" -- "${exempt[@]}" || true)
            if [ -n "$hits" ]; then
              echo "::error title=Private IP detected::Pattern '$p' matched:"
              echo "$hits"
              fail=1
            fi
          done
          for p in "${str_patterns[@]}"; do
            hits=$(git grep -nIE "$p" -- "${exempt[@]}" || true)
            if [ -n "$hits" ]; then
              echo "::error title=Private artefact detected::Pattern '$p' matched:"
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

  reuse:
    name: REUSE — licensing of every file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
