title = "labelyard gitleaks config"

[extend]
# Use default rules plus our custom one
useDefault = true

[[rules]]
id = "labelhub-pat"
description = "Labelyard Personal Access Token"
regex = '''lh_pat_[A-Za-z0-9_-]{43}'''
keywords = ["lh_pat_"]
tags = ["key", "label-hub", "pat"]
