# The former product name is an error unless the line also names Labelyard (the subtitle rule of
# scripts/brand_guard.py). Vale has no per-line exception for a plain existence rule, so this is
# a script over the raw file: it looks line by line and skips fenced and inline code. A line
# that starts "Formerly *Label Printer Hub*." and the README tagline are the README's own statements
# of the former name, as in the guard.
extends: script
message: "'%s' is the former product name. Write Labelyard."
level: error
scope: raw
script: |
  text := import("text")
  old := "Label Printer Hub"
  matches := []
  in_fence := false
  offset := 0
  for line in text.split(scope, "\n") {
    trimmed := text.trim_space(line)
    if text.has_prefix(trimmed, "```") || text.has_prefix(trimmed, "~~~") {
      in_fence = !in_fence
    } else if !in_fence && !text.contains(line, "Labelyard") && !text.has_prefix(trimmed, "Formerly *" + old + "*.") && trimmed != "**The self-hosted " + old + " for all your labels.**" {
      start := 0
      for {
        rest := line[start:]
        rel := text.index(rest, old)
        if rel < 0 { break }
        begin := start + rel
        ticks := len(text.split(line[:begin], "`")) - 1
        if ticks % 2 == 0 {
          matches = append(matches, {begin: offset + begin, end: offset + begin + len(old)})
        }
        start = begin + len(old)
      }
    }
    offset += len(line) + 1
  }
