# Prose checks (Vale v3.26.0). Rules: docs/glossary.toml feeds Terms.yml and the vocabularies
# (python3 scripts/glossary.py write); OldName, Filler and SentenceLength are written by hand.
# Levels: error fails CI; warning and suggestion are only reported.
# Run: scripts/vale_setup.sh (once), then scripts/vale_scope.py | xargs .vale/bin/vale
# Spelling is off in both languages: dictionaries for product terms and German compounds would
# make the check red without a defect.
StylesPath = .vale/styles
MinAlertLevel = suggestion
# The vocabulary is named here, not in the section: Vale.Terms can only be switched off for a
# vocabulary that is global (a section's own Vocab keeps it on).
Vocab = Labelyard-en
Packages = https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/vale-cli/MDX/releases/download/v0.3.0/MDX.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Labelyard, write-good
Vale.Spelling = NO
# Accepted terms would be enforced with their exact capitalisation, which sentence starts break.
Vale.Terms = NO
# Strings that contain a rejected word legitimately: the product subtitle and the header name.
TokenIgnores = (Label Printer Hub), (X-Label-Hub-Key)
# Only two of the write-good rules are wanted, and only as suggestions.
write-good.Weasel = suggestion
write-good.TooWordy = suggestion
write-good.Cliches = NO
write-good.E-Prime = NO
write-good.Illusions = NO
write-good.Passive = NO
write-good.So = NO
write-good.ThereIs = NO

# A later matching section replaces BasedOnStyles.
[website/src/content/docs/de/**/*.{md,mdx}]
BasedOnStyles = Vale, Labelyard-de
Vocab = Labelyard-de
Vale.Spelling = NO
Vale.Terms = NO
# German repeats words correctly ("ein Origin, der der Adresse entspricht"), so the English
# repetition check does not apply.
Vale.Repetition = NO
# Accepted terms would be enforced with their exact capitalisation; lower-case "band" or "rolle"
# are ordinary verb forms.
Vale.Labelyard-de.Terms = NO
TokenIgnores = (Label Printer Hub), (X-Label-Hub-Key)

# README.md: the tagline and the "Formerly" sentence may name the former product (own rule).
[README.md]
BasedOnStyles = Vale, Labelyard, LabelyardReadme, write-good
Labelyard.OldName = NO

# The pages that name the former product on purpose (the brand guard allows the same files) have
# no OldName rule. (The rejected German term "Label" is enforced by Labelyard-de.Label, which skips
# lines with the subtitle, because TokenIgnores does not reach front matter.)
[docs/migration/labelyard.md]
BasedOnStyles = Labelyard
Labelyard.OldName = NO
[docs/decisions/*-rename-to-labelyard.md]
BasedOnStyles = Labelyard
Labelyard.OldName = NO
[website/src/content/docs/admin/upgrades/from-label-printer-hub.md]
BasedOnStyles = Labelyard
Labelyard.OldName = NO
[website/src/content/docs/de/admin/upgrades/from-label-printer-hub.md]
BasedOnStyles = Labelyard-de
Labelyard-de.OldName = NO
