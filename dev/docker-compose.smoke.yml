# Local smoke test — build and start the hub (one container: API and web UI).
#
#   docker compose -f dev/docker-compose.smoke.yml up --build
#
# After startup: http://localhost:8000  (UI at /, API at /api, docs at /docs)
#
# The image is built from the local source tree (base images are still fetched
# as usual); the build context is the repository root because the web app is
# built into the image. No printer is configured: add printers in the UI
# (Settings > Printers). The secret key comes from your shell (see dev/README.md);
# the bootstrap key below is a fake value for this throw-away stack and signs
# you in once.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Local name only; this stack never pushes (the published image is labelyard).
    image: labelyard:smoke
    container_name: labelyard-smoke-backend
    user: "1000:1000"
    networks:
      - hub-internal
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      LABELYARD_LOG_LEVEL: "INFO"
      LABELYARD_SECRET_KEY: "${LABELYARD_SECRET_KEY:?set LABELYARD_SECRET_KEY - generate with: openssl rand -base64 32 | tr '+/' '-_'}"
      LABELYARD_PUBLIC_URL: "http://localhost:8000"
      LABELYARD_BOOTSTRAP_ADMIN_KEY: "smoke-bootstrap-key-fake-value-0123456789"
      LABELYARD_DATABASE_URL: "sqlite+aiosqlite:////data/printer-hub.db"
      LABELYARD_WEBHOOK_API_KEY: "smoke-test-key-must-be-at-least-32-chars-long"
      LABELYARD_SSE_QUEUE_SIZE: "32"
      LABELYARD_SSE_HEARTBEAT_S: "30"
      LABELYARD_SSE_IDLE_TIMEOUT_S: "300"
      LABELYARD_SSE_MAX_SUBSCRIBERS: "100"
      LABELYARD_SSE_PROBE_INTERVAL_S: "30"
    volumes:
      - smoke-data:/data
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  hub-internal:
    driver: bridge

volumes:
  smoke-data:
