# Local smoke test — build and start the hub (one container: API and web UI).
#
#   docker compose -f dev/docker-compose.smoke.yml up --build
#
# After startup: http://localhost:8000  (UI at /, API at /api, docs at /docs)
#
# The image is built from the local source tree (base images are still fetched
# as usual); the build context is the repository root because the web app is
# built into the image. No printer is configured: add printers in the UI
# (Settings > Printers). The secret key and bootstrap key below are fake values
# for this throw-away stack; the bootstrap key signs you in once.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: label-printer-hub-smoke-backend
    user: "1000:1000"
    networks:
      - hub-internal
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      PRINTER_HUB_LOG_LEVEL: "INFO"
      PRINTER_HUB_SECRET_KEY: "c21va2UtdGVzdC1rZXktZmFrZS0wMTIzNDU2Nzg5ISE="
      PRINTER_HUB_PUBLIC_URL: "http://localhost:8000"
      PRINTER_HUB_BOOTSTRAP_ADMIN_KEY: "smoke-bootstrap-key-fake-value-0123456789"
      PRINTER_HUB_DATABASE_URL: "sqlite+aiosqlite:////data/printer-hub.db"
      PRINTER_HUB_WEBHOOK_API_KEY: "smoke-test-key-must-be-at-least-32-chars-long"
      PRINTER_HUB_SSE_QUEUE_SIZE: "32"
      PRINTER_HUB_SSE_HEARTBEAT_S: "30"
      PRINTER_HUB_SSE_IDLE_TIMEOUT_S: "300"
      PRINTER_HUB_SSE_MAX_SUBSCRIBERS: "100"
      PRINTER_HUB_SSE_PROBE_INTERVAL_S: "30"
    volumes:
      - smoke-data:/data
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  hub-internal:
    driver: bridge

volumes:
  smoke-data:
